<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

       a:hover{
        color: brown;
        font-size: 20px;
       }
       a:active{
        color: yellowgreen  ;
        font-size: x-large;
       }

       a:visited{
        text-decoration: none;
       }



       ul{
        list-style: none; display: flex;
       }
      
       ul li{
        margin: 20px; border-right: 1px solid red;
        padding-right: 20px;
       }

       ul li:nth-child(5){
        border-right: 0px;
       }
       
    </style>
</head>
<body>
    
<a href=""> visit link </a>

<ul>
    <li>home</li>
    <li>service</li>
    <li>about</li>
    <li>gallery</li>
    <li>contact</li>
</ul>

</body>
</html>
