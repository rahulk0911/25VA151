<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    </title>
    <style>
body{ 
font-family: Arial, sans-serif; 
margin: 20px; 
background: #ffffff; 
} 
h2{text-align: center;} 
    .container{ 
      display: flex;                 
      flex-direction: row;        
      justify-content: center;     
      align-items: center;          
      gap: 20px;
      flex-wrap: wrap;              
    } 
    .card{ 
      background: #fff; 
      border-radius: 8px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      width: 220px; 
      text-align: center; 
      padding: 16px; 
    } 
    .avatar{ 
      width: 70px; height: 70px; 
      background: #6490be; color: #ffffff; 
      border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
      font-size: 20px; margin: 0 auto 12px; 
    } 
    .name{ font-weight: bold; font-size: 18px; } 
    .detail{ font-size: 14px; color: #555; margin: 2px 0; } 
  </style>
    </style>
</head>
<body>
    <h2>Student Profile Cards</h2> 
  <div class="container"> 
    <div class="card"> 
      <div class="avatar">PK</div> 
      <div class="name">Priyanshu Kumar</div> 
      <div class="detail">B.Tech - CSE</div> 
      <div class="detail">Roll No: 2025B01010336</div> 
      <div class="detail">1st Year</div> 
    </div> 
    <div class="card"> 
      <div class="avatar">RY</div> 
      <div class="name">Rahul Yadav</div> 
      <div class="detail">B.Tech - CSE</div> 
      <div class="detail">Roll No: 2025B01010338</div> 
      <div class="detail">1st Year</div> 
    </div> 
    <div class="card"> 
      <div class="avatar">PG</div> 
      <div class="name">Pushkar Goel</div> 
      <div class="detail">B.Tech - CSE</div> 
      <div class="detail">Roll No: 2025B01010337</div> 
      <div class="detail">1st Year</div> 
    </div> 
  </div> 
</body>
</html>
