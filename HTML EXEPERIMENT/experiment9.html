<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #d3c4c4;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(177, 131, 131, 0.1);
      padding: 16px;
      text-align: center;
    }

    .card img {
      width: 200px;
      height: auto;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 18px;
      margin: 8px 0;
    }

    .card p {
      font-size: 14px;
      color: #555;
      margin: 4px 0;
    }

    .price {
      font-weight: bold;
      color: #3d9bff;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h2>Responsive Product Grid</h2>
  <div class="grid">
    <div class="card">
      <img
        src="https://www.lifewire.com/thmb/AnvL-ZvMMbbFQJhV4n8GILdfnlE=/1280x1280/filters:no_upscale():max_bytes(150000):strip_icc()/pictek-gaming-mouse-5b2c1da8a9d4f90037b42f8b.jpg"
        alt="Product 1">
      <h3>Product 1</h3>
      <p>High-quality item with great features.</p>
      <p class="price">₹499</p>
    </div>

    <div class="card">
      <img src="https://icon.in/cdn/shop/files/1_50b8664b-0c2b-477a-9d86-ed6fce060859.jpg?v=1756985540&width=1946"
        alt="Product 2">
      <h3>Product 2</h3>
      <p>Durable and stylish for daily use.</p>
      <p class="price">₹799</p>
    </div>

    <div class="card">
      <img src="https://cottonfolk.in/cdn/shop/files/Men_sBrownPinstripeShort-SleeveShirt.jpg?v=1732268509&width=2048"
        alt="Product 3">
      <h3>Product 3</h3>
      <p>Lightweight and comfortable.</p>
      <p class="price">₹1,299</p>
    </div>

    <div class="card">
      <img src="https://img.tatacliq.com/images/i18//437Wx649H/MP000000022848373_437Wx649H_202407091408301.jpeg"
        alt="Product 4">
      <h3>Product 4</h3>
      <p>Trendy design with premium quality.</p>
      <p class="price">₹999</p>
    </div>
  </div>
</body>

</html>
